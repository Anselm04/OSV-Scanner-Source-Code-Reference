name: Verify pinned Git source tree osv-scanner
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/google/osv-scanner.git
      upstream_sha: 80fe50567a5d6e0ec408353e2ceacca1561b91be
      audit_slug: osv-scanner
