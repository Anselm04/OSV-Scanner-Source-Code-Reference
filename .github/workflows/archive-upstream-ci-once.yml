name: Preserve original upstream workflow code as inert reference
on:
  push:
    paths:
      - '.github/workflows/archive-upstream-ci-once.yml'
permissions:
  contents: write
jobs:
  archive:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-inert-ci-archive.yml@main
    with:
      upstream_url: https://github.com/google/osv-scanner.git
      upstream_sha: 80fe50567a5d6e0ec408353e2ceacca1561b91be
      archive_slug: osv-scanner
